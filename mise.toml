# junit-platform-console-testexecutionlisteners - mise configuration
# Java 21 + Maven. Nothing else is needed to build, test or publish this library.

[tools]
java = "temurin-21"
maven = "3.9.16"

[env]
MAVEN_COMPILER_RELEASE = "21"

[tasks.build]
description = "Clean build and install to the local repository"
run = "mvn clean install"

[tasks.test]
description = "Run tests"
run = "mvn test"

[tasks.verify]
description = "Build and run all checks (what PR CI runs)"
run = "mvn verify"

[tasks.compile]
description = "Compile main sources only"
run = "mvn compile"
