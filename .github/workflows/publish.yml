# Publishes a release to CodeArtifact on every push to production (normally a merged PR).
# master keeps <revision>3.0.0-SNAPSHOT and never publishes, so dependents only see release versions.
# The published version is 3.0.0-<UTC timestamp> (e.g. 3.0.0-20261111103000). The timestamp sorts
# chronologically under Maven version ordering, which dependabot relies on. No manual bump is needed.
# CodeArtifact versions are immutable; the timestamp is unique per run, and an existing version is skipped.
name: Publish (production)

on:
  push:
    branches:
      - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release version
        id: rev
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(sed -n 's:.*<revision>\(.*\)-SNAPSHOT</revision>.*:\1:p' pom.xml | head -1)
          if [ -z "${BASE}" ]; then
            echo "::error::No <revision>X-SNAPSHOT</revision> found in pom.xml"
            exit 1
          fi
          VERSION="${BASE}-$(date -u +%Y%m%d%H%M%S)"
          echo "revision=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Publishing ${VERSION} from $(git rev-parse --short=7 HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.OIDC_ROLE_ARN }}
          role-session-name: GitHubAction-AssumeRoleWithAction
          aws-region: eu-central-1

      # Uses the OIDC role above, so no long-lived CodeArtifact token is stored in GitHub. The token is
      # short-lived (12h) and masked in logs. ginmon/gh-actions is private and not resolvable from this repo.
      - name: Configure Maven for CodeArtifact
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT=$(aws codeartifact get-repository-endpoint \
            --domain ginmon --domain-owner 735822157553 \
            --repository internal --format maven \
            --query repositoryEndpoint --output text)
          TOKEN=$(aws codeartifact get-authorization-token \
            --domain ginmon --domain-owner 735822157553 \
            --query authorizationToken --output text)
          echo "::add-mask::${TOKEN}"
          mkdir -p "${HOME}/.m2"
          cat > "${HOME}/.m2/settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>ginmon-internal</id>
                <username>aws</username>
                <password>${TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          echo "CodeArtifact Maven endpoint: ${ENDPOINT}"

      - name: Publish to CodeArtifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.rev.outputs.revision }}"
          if aws codeartifact describe-package-version \
               --domain ginmon --domain-owner 735822157553 \
               --repository internal \
               --format maven --namespace io.github.rkraneis \
               --package junit-platform-console-testexecutionlisteners \
               --package-version "${VERSION}" >/dev/null 2>&1; then
            echo "Version ${VERSION} already published; skipping."
            exit 0
          fi
          mvn --batch-mode --no-transfer-progress deploy -DskipTests \
            -Drevision="${VERSION}"
